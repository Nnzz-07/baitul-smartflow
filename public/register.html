<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Jamaah - Baitul SmartFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans hero-bg relative min-h-screen flex flex-col justify-center items-center py-10">
    <div class="absolute inset-0 bg-emerald-900 bg-opacity-70 pattern-overlay"></div>

    <div class="relative z-10 w-full max-w-md p-4">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-3 text-white hover:text-emerald-200 transition">
                <i class="fa-solid fa-mosque text-4xl"></i>
                <span class="text-3xl font-bold font-amiri tracking-wider">Baitul SmartFlow</span>
            </a>
            <p class="text-emerald-100 mt-2 font-medium">Pendaftaran Akun Jamaah Baru</p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-emerald-600 px-6 py-4 text-white">
                <h2 class="text-xl font-bold font-amiri"><i class="fa-solid fa-user-plus mr-2"></i> Form Pendaftaran</h2>
            </div>
            <div class="p-8">
                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="nama">Nama Lengkap</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-id-card text-gray-400"></i>
                            </div>
                            <input class="border border-gray-300 rounded-lg w-full py-3 pl-10 pr-3 focus:outline-none focus:ring-2 focus:ring-emerald-500" id="nama" type="text" placeholder="Nama lengkap Anda" required>
                        </div>
                    </div>
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="username">Username</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-user text-gray-400"></i>
                            </div>
                            <input class="border border-gray-300 rounded-lg w-full py-3 pl-10 pr-3 focus:outline-none focus:ring-2 focus:ring-emerald-500" id="username" type="text" placeholder="Pilih username unik" required minlength="4" pattern="[a-zA-Z0-9_]+" title="Hanya huruf, angka, dan underscore">
                        </div>
                    </div>
                    <div class="mb-5">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Kata Sandi</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-gray-400"></i>
                            </div>
                            <input class="border border-gray-300 rounded-lg w-full py-3 pl-10 pr-3 focus:outline-none focus:ring-2 focus:ring-emerald-500" id="password" type="password" placeholder="Minimal 6 karakter" required minlength="6">
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="confirmPassword">Konfirmasi Kata Sandi</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-gray-400"></i>
                            </div>
                            <input class="border border-gray-300 rounded-lg w-full py-3 pl-10 pr-3 focus:outline-none focus:ring-2 focus:ring-emerald-500" id="confirmPassword" type="password" placeholder="Ulangi kata sandi" required minlength="6">
                        </div>
                    </div>
                    <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg flex items-center justify-center gap-2" type="submit" id="submitBtn">
                        <span>Daftar Sekarang</span> <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
            <div class="bg-gray-50 py-4 text-center border-t text-sm text-gray-600">
                Sudah punya akun? <a href="login.html" class="font-semibold text-emerald-600 hover:text-emerald-800">Masuk di sini</a>
            </div>
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-emerald-100 hover:text-white transition text-sm">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda
            </a>
        </div>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const nama = document.getElementById('nama').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) {
                Swal.fire('Validasi', 'Konfirmasi kata sandi tidak cocok.', 'warning');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...';

            try {
                const response = await fetch('https://baitul-smartflow-api-1777252841.fly.dev/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, nama })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Alhamdulillah',
                        text: 'Pendaftaran berhasil! Silakan login dengan akun baru Anda.',
                        confirmButtonColor: '#059669'
                    }).then(() => {
                        window.location.href = 'login.html';
                    });
                } else {
                    Swal.fire('Pendaftaran Gagal', data.message || data.error || 'Username mungkin sudah digunakan.', 'error');
                }
            } catch (err) {
                Swal.fire('Kesalahan Jaringan', 'Tidak dapat terhubung ke server API.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Daftar Sekarang</span> <i class="fa-solid fa-paper-plane"></i>';
            }
        }
    </script>
</body>
</html>
